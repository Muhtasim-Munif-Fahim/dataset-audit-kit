<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Dataset audit kit demo screenshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <rect x="48" y="48" width="1104" height="624" rx="28" fill="url(#panel)" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="126" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">dataset-audit-kit</text>
  <text x="80" y="168" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="22">schema checks + missingness + duplicates + drift</text>
  <rect x="80" y="220" width="540" height="340" rx="20" fill="#020617" stroke="#334155" stroke-width="2"/>
  <text x="110" y="266" fill="#22c55e" font-family="Consolas, Menlo, monospace" font-size="22">$ dataset-audit-kit audit iris.csv --reference iris_reference.csv</text>
  <text x="110" y="320" fill="#e2e8f0" font-family="Consolas, Menlo, monospace" font-size="22">Status: warn</text>
  <text x="110" y="362" fill="#e2e8f0" font-family="Consolas, Menlo, monospace" font-size="22">Duplicate rows: 1</text>
  <text x="110" y="404" fill="#e2e8f0" font-family="Consolas, Menlo, monospace" font-size="22">Missing cells: 1</text>
  <text x="110" y="446" fill="#e2e8f0" font-family="Consolas, Menlo, monospace" font-size="22">Drift score: 0.184</text>
  <text x="110" y="500" fill="#fca5a5" font-family="Consolas, Menlo, monospace" font-size="22">Issue: sepal length (cm) has 16.7% missing values.</text>
  <rect x="660" y="220" width="412" height="340" rx="20" fill="#ffffff" opacity="0.95"/>
  <text x="696" y="270" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">What it checks</text>
  <text x="696" y="322" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">• expected columns</text>
  <text x="696" y="362" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">• missing values</text>
  <text x="696" y="402" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">• duplicate rows</text>
  <text x="696" y="442" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">• label balance</text>
  <text x="696" y="482" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">• reference drift</text>
  <text x="80" y="626" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Built to be easy to test, document, and maintain.</text>
</svg>
